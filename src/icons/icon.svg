<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="deep.api">
  <!-- deep.api 图标主文件（唯一真相源）。
       隐喻：桥接 —— 左块（网页端）与右块（API 端）被一条通道贯通，即"把网页变成接口"。

       16px 约束（本图为此专门调过比例，勿随意缩放元素）：
         Chrome 工具栏按 16px 渲染，是本图最苛刻的场景。定稿前用 16px 实际光栅化逐个候选比对：
           - 双箭头（⇄）方案淘汰：箭头在 16px 下被抗锯齿糊成一团蓝色色块，两端反而变虚。
           - 圆/方异形方案淘汰：圆的曲率在 16px 下丢失，左端退化成糊斑。
           - 浏览器标题栏开槽方案淘汰：16px 下读成"两块堆叠"，语义反而变歧义。
         现方案只用「两个实心圆角方块 + 一条连接条」，无描边、无渐变、无亚像素元素：
         方块 36/128 → 16px 实心 4.5px；连接条 12/128 → 16px 约 1.5px，均稳定可见。

       颜色取 DeepSeek 品牌蓝 #4D6BFE：实心蓝底在 Chrome 浅色/深色工具栏下都有存在感，
       不依赖浏览器主题反色（MV3 下我们不声明 theme，拿不到自动单色化）。 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#4D6BFE"/>
  <g fill="#FFFFFF">
    <rect x="16" y="46" width="36" height="36" rx="9"/>
    <rect x="76" y="46" width="36" height="36" rx="9"/>
    <rect x="48" y="58" width="32" height="12" rx="6"/>
  </g>
</svg>
