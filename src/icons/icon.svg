<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="deep.api">
  <!-- deep.api 图标主文件（唯一真相源）。
       图案：DeepSeek 鲸鱼（DeepSeek 官方 logo 的鲸鱼轮廓，取自 Simple Icons 的 deepseek path，CC0）。
       deep.api 是 DeepSeek 网页端的桥接层，用鲸鱼当识别符号；配色与官方蓝底白鲸相反——
       蓝底（#4D6BFE，官方品牌蓝）保留，鲸鱼改绿（#12B76A）以示"这不是 DeepSeek 官方产物"。

       16px 约束（已知代价，非遗漏）：Chrome 工具栏按 16px 渲染，鲸鱼在该尺寸下会糊成一团——
       鱼鳍、眼睛孔、尾鳍细节全部丢失，只剩"蓝底上一个绿缺口"。定稿前已按 16/32/48/128
       实际光栅化逐个比对；旧图标（两个圆角方块 + 一条连接条）当初正是为 16px 可读性才
       去掉全部细节的，换鲸鱼即放弃该约束。2026-10-01 用户明确拍板接受（DeepSeek 自家
       favicon 在 16px 下同样如此）。若日后要救 16px：另做一份简笔鲸鱼，在
       scripts/gen-icons.mjs 里按尺寸选源文件，勿在本文件里塞两套图形。

       构图：本 path 的墨迹包围盒为 24×17.672（垂直居中，x 0..24 / y 3.164..20.836），
       按宽度占方块 78% 缩放 → scale(3.9)；再按该包围盒把墨迹摆到方块正中 → translate(17.2,17.2)。
       结果：鲸鱼墨迹落在 x 17.2..110.8（宽 93.6）、y 29.6..98.5（高 68.9），居于 4..124 的
       圆角方块内、四周留白对称，尾鳍不压边。改这两个数前先按上述包围盒重算，勿手调试凑。 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#4D6BFE"/>
  <g transform="translate(17.2,17.2) scale(3.9)">
